name: Release

# Push a `vX.Y.Z` tag and this publishes a GitHub release: the built sdist and wheel,
# with the `## [X.Y.Z]` section of CHANGELOG.md as its notes. It can also be run by
# hand on an existing tag (Actions -> Release -> Run workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0  # the version comes from the git tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          version="${TAG#v}"
          test -f "dist/kaisparov-${version}.tar.gz" || {
            echo "::error::built a version other than ${version}:"; ls dist; exit 1; }

      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v head="## [${version}]" '
            /^## \[/ { if (found) exit; if (index($0, head) == 1) { found = 1; next } }
            found' CHANGELOG.md > notes.md
          test -s notes.md || {
            echo "::error::CHANGELOG.md has no '## [${version}]' section"; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
