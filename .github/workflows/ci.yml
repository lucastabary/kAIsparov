name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements*.txt

      # The pinned requirements, so CI tests the stack the project runs on. Two changes:
      # torch comes first from the CPU index (a CUDA wheel from PyPI is ~800 MB), and
      # pygame is left out, which proves the suite is collectable without the UI.
      - name: Install dependencies (CPU wheels, no pygame)
        run: |
          python -m pip install --upgrade pip
          pip install "$(grep -E '^torch==' requirements.txt)" --index-url https://download.pytorch.org/whl/cpu
          cat requirements.txt requirements-dev.txt | grep -vE '^[[:space:]]*(-r |pygame)' > ci-requirements.txt
          pip install -r ci-requirements.txt
          pip install -e . --no-deps
          python -c "import torch; print('torch', torch.__version__)"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Mypy
        run: mypy src/kaisparov

      - name: Import contracts
        run: lint-imports

      - name: Pytest
        run: pytest
