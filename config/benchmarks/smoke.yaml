# Smoke suite: small and fast, one example of every task kind. It checks that the
# benchmark pipeline works end to end, not that a model is any good.
#
#   kaisparov bench run config/benchmarks/smoke.yaml -a random -a material
#
# Each entry names a generator (`kaisparov bench generators` lists them), how many
# problems to draw and its parameters. The seed fixes every problem: same file, same
# seed, same suite. Freeze one with `kaisparov bench generate <spec> -o <file>.jsonl`.

name: smoke
description: "Pipeline check: one example of each task kind."
seed: 0

problems:
  - generator: mate_in_one
    count: 20
    params:
      max_pieces: 4

  - generator: fixed
    params:
      theme: handwritten
      problems:
        # Back-rank mate: the black king is shut in by its own pawns on f7/g7/h7.
        - fen: "7k/5ppp/8/8/8/8/5PPP/R6K w - - 0 1"
          theme: mate_in_one
          task: {kind: find_move, accepted: [a1a8]}

        # The rook on a2 is the only thing guarding the first rank. Every move that
        # leaves it — grabbing the knight on a5 included — loses to ...Re1#, and so
        # does h1, the one king move. Only a pawn move survives.
        - fen: "4r1k1/5ppp/8/n7/8/8/R4PPP/6K1 w - - 0 1"
          theme: avoid_mate
          task:
            kind: avoid_moves
            forbidden: [a2a5, a2a4, a2a3, a2d2, a2c2, a2b2, g1h1]

        # King and queen against a bare king: finish the job. Genuinely hard for a
        # baseline — mating technique is not something greed stumbles into.
        - fen: "8/8/8/4k3/8/8/2Q5/4K3 w - - 0 1"
          theme: conversion
          task: {kind: play_out, opponent: random, max_plies: 60, goal: win}

        # Rook against rook: do not lose it.
        - fen: "4k3/r7/8/8/8/8/7R/4K3 w - - 0 1"
          theme: defence
          task: {kind: play_out, opponent: material, max_plies: 40, goal: not_lose}
