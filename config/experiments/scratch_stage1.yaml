# Fresh training, stage 1/3 — small endgames vs an opponent league.
#   kaisparov train --config config/experiments/scratch_stage1.yaml
#   tensorboard --logdir runs/
#
# Watch eval/winrate_vs_material (vs_random saturates and is uninformative here).

title: "scratch v2 - stage 1 (8 pieces, league + dense rewards)"
description: |
  Restart from scratch with the new recipe: dense king-safety reward, an opponent
  league seeded with the greedy MaterialAgent + a RandomAgent (so hanging the king
  or a piece is punished immediately from epoch 1), bigger batches, and standard
  material values. Stage 1 stays in small 8-piece endgames where king captures are
  reachable and material is clean to learn. Ramp up in stage 2/3.

model: rgcn
hidden_dim: 16
epochs: 100
seed: 0
device: auto          # -> CPU on this machine
checkpoint_every: 20

curriculum:
  name: "8 pieces, all types"
  max_pieces_per_side: 3
  allow_major: true
  allow_minor: true
  allow_pawns: false

rollout:
  episodes_per_epoch: 16       # less noisy PPO gradient than 8
  max_steps_per_episode: 60
  opponent: pool               # league instead of pure self-play
  baselines: ["material", "random"]
  pool_size: 5
  snapshot_every: 20           # also add past selves to the league
  # Keep the tactical teachers dominant even as snapshots accumulate: draw the
  # baselines vs the snapshots 2:1 (instead of the old uniform draw, where 5
  # snapshots shrink Material from 1/2 of games to ~1/7 and the rush goes
  # unpunished). Within the baselines, Material is the real teacher — 3x Random.
  baseline_weight: 2.0
  snapshot_weight: 1.0
  baseline_weights: [3.0, 1.0]   # material : random
  # Past selves look 1 ply ahead (Minimax): even with a weak critic they refuse
  # to walk into a king capture and grab a hung king, so a rush must be *sound*.
  # depth=1 is cheap on these 8-piece boards; raise with care on bigger stages.
  snapshot_search_depth: 1

ppo:
  learning_rate: 0.001
  update_epochs: 2             # less overfitting of each (still small) batch
  entropy_coef: 0.02           # keep exploration alive (was collapsing to ~1.5)

eval:
  enabled: true
  every: 25
  games: 40                    # less noisy eval than 20
  max_plies: 120

# material_aware = win_focused + a per-ply king_safety penalty (0.5) for leaving your
# own king capturable — the dense signal this stage's recipe is built around.
reward: material_aware
