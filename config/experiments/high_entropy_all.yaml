# high_entropy v4 — the whole curriculum in one command
#   kaisparov train --config config/experiments/high_entropy_all.yaml
#   tensorboard --logdir runs/
#
# This file is the *entry point* of the recipe. It lists the stages to run, in order,
# and holds the settings that are the same in every one of them. Each stage after
# the first automatically resumes from the run the previous one produced, so the
# `resume_from_run: PASTE_..._HERE` placeholders inside the phase files are
# overridden with the real run ids — you never copy a run id by hand.
#
# How a stage's config is built: the settings below, then the stage file on top
# (a stage that sets a key wins). A resumed stage also inherits every key it doesn't
# set from the previous run. So each phase file holds only what changes from the
# phase before it.
#
# Same curriculum as scratch_v4 (opponents DEFEND from epoch 1 via avoid_king_suicide
# in config/pools.yaml; pure outcome reward, no shaping), but wider and pushed toward
# more exploration: hidden_dim 32->64, entropy_coef x4, more epochs at every stage.
# Goal: a more robust, less exploitable, more "creative" policy than v4.

title: "high_entropy v4 - full curriculum (phases 1a -> 3)"
description: >
  Sound play from 4-piece endgames to the full game, with hidden_dim 64 and 4x the
  entropy bonus of scratch_v4: wider, more exploratory, less brittle final policy.

stages:
  - high_entropy_phase1-1.yaml   # 4 pieces/side, no pawns — force a sound king capture
  - high_entropy_phase1-2.yaml   # same, but opponents defend their king
  - high_entropy_phase2.yaml     # 10 pieces + pawns, snapshot stream joins the pool
  - high_entropy_phase3.yaml     # standard starting position, defending self-play

# ---------------------------------------------------------------- shared by every stage
model: rgcn
hidden_dim: 64          # fixed for the WHOLE curriculum (resume requires matching width); v4 used 32
seed: 0
device: auto            # -> CPU on this machine
checkpoint_every: 20

# Pure outcome. All shaping terms (check, step_penalty) are OFF.
reward: checkmate_only

rollout:
  opponent: pool
  num_workers: 1            # serial: parallel rollout's IPC (pickling graph transitions) outweighed the gain here
  episodes_per_epoch: 16    # less noisy PPO gradient than 8

ppo:
  update_epochs: 2          # less overfitting of each small batch

eval:
  enabled: false
