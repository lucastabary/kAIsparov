# scratch v4 — the whole curriculum in one command
#   kaisparov train --config config/experiments/scratch_v4/all.yaml
#
# Each stage after the first resumes from the run the previous one produced, so
# the `resume_from_run: PASTE_..._HERE` placeholders in the phase files are
# overridden with the real run ids. The phase files hold all their own settings.

title: "scratch v4 - full curriculum"
description: "sound play from the start: 4-piece endgames (then defended) -> 10 pieces + pawns -> real game"

stages:
  - phase1-1.yaml
  - phase1-2.yaml
  - phase2.yaml
  - phase3.yaml
