# Fresh training, stage 2/3 — more pieces, longer games.
#   1) find stage 1's run id:  kaisparov runs list
#   2) paste it below as resume_from_run
#   3) kaisparov train --config config/experiments/scratch_stage2.yaml
#
# Architecture, reward, opponent league and PPO settings are inherited from the
# parent run; only what's listed here is overridden.

resume_from_run: PASTE_STAGE1_RUN_ID_HERE

title: "scratch v2 - stage 2 (16 pieces)"
description: |
  Continue stage 1, doubling the material to 16 pieces per side and lengthening the
  games so more complex middlegames appear. Same league + dense rewards. The
  weighted opponent pool and depth-1 Minimax snapshots are inherited from stage 1;
  only the entropy floor is nudged up a touch for the harder, larger action space.

epochs: 100

curriculum:
  name: "16 pieces, all types"
  max_pieces_per_side: 16
  allow_major: true
  allow_minor: true
  allow_pawns: true

rollout:
  max_steps_per_episode: 100
  # baseline_weight / snapshot_weight / baseline_weights / snapshot_search_depth
  # are inherited from the stage-1 parent run (depth-1 stays cheap enough here).

ppo:
  entropy_coef: 0.025          # more pieces -> harder to keep exploring; hold it up

eval:
  enabled: true
  every: 25
  games: 40                    # less noisy eval than 20
  max_plies: 120
