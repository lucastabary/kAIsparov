# Fresh training, stage 3/3 — full games from the standard starting position.
#
# Easiest: chain all three stages in one command (no run ids to copy) —
#   kaisparov train --config config/experiments/scratch_stage1.yaml \
#                            config/experiments/scratch_stage2.yaml \
#                            config/experiments/scratch_stage3.yaml
# When chained, `resume_from_run` below is overridden by stage 2's actual run id.
#
# Or run this stage on its own:
#   1) find stage 2's run id:  kaisparov runs list
#   2) paste it below as resume_from_run
#   3) kaisparov train --config config/experiments/scratch_stage3.yaml

resume_from_run: PASTE_STAGE2_RUN_ID_HERE

title: "scratch v2 - stage 3 (full games)"
description: |
  Graduate to full 32-piece games from the normal starting position, reached only
  after the model can already handle king safety and material in smaller positions.
  Weighted league + Minimax snapshots inherited from stage 1; entropy floor nudged
  up again for the full-width action space.

epochs: 200

curriculum: null            # standard starting position

rollout:
  max_steps_per_episode: 160
  # Depth-1 Minimax snapshots are inherited. On full 32-piece boards the branching
  # factor is large, so this is the costliest stage for search — if the rollout is
  # too slow on CPU, set `snapshot_search_depth: 0` here to fall back to cheap
  # policy-sampling snapshots (Material still supplies the tactical pressure).
  snapshot_search_depth: 1

ppo:
  entropy_coef: 0.03           # widest action space -> strongest exploration floor

eval:
  max_plies: 200
