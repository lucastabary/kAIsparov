# scratch v3 — the whole curriculum in one command
#   kaisparov train --config config/experiments/scratch_v3/all.yaml
#
# Each stage after the first resumes from the run the previous one produced, so
# the `resume_from_run: PASTE_..._HERE` placeholders in the phase files are
# overridden with the real run ids. The phase files hold all their own settings.

title: "scratch v3 - full curriculum"
description: "king capture only: 4-piece endgames -> 12 pieces + pawns -> real game"

stages:
  - phase1.yaml
  - phase2.yaml
  - phase3.yaml
