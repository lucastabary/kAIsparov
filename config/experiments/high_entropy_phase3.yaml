# high_entropy v4 — phase 3 · the real game (standard starting position)
#   part of high_entropy_all.yaml; to run it alone:
#   1) run phase2, then:  kaisparov runs list   (copy its run id)
#   2) paste it below as resume_from_run
#   3) kaisparov train --config config/experiments/high_entropy_phase3.yaml
#
# Only what changes from phase 2 is here; everything else (including its 400 epochs)
# is inherited from it. `curriculum: null` disables the piece-count curriculum, so
# games start from the normal chess position — the actual task the model is meant
# to play.
#
# Same stage goal as scratch_v4 stage3: full game, sound play. Pool switched to
# v4_phase3: defending self-play (snapshots) dominates (weighted above the
# baselines) and every opponent defends its own king. This phase still gets more
# exploration room than v4 did, for a less brittle, more creative final policy.

resume_from_run: PASTE_PHASE2_RUN_ID_HERE

title: "high_entropy v4 - phase 3 (real game)"
description: |
  Final phase: full standard starting position, longest games. Pure outcome reward
  kept. Pool tilts toward defending self-play; every opponent defends its king.
  Lowest LR (1e-4) of the curriculum; entropy still x4 vs scratch_v4 and more
  epochs, aiming for a more robust/creative final policy rather than pure sharpening.

# Disable the curriculum -> start from the normal chess position ("vraie partie").
curriculum: null

rollout:
  pool: v4_phase3                  # material + random + snapshots (weighted up), all guarded
  max_steps_per_episode: 150

ppo:
  learning_rate: 0.0001            # refinement only
  entropy_coef: 0.024              # v4 x4 (0.006 -> 0.024): sharpen less than v4, keep some exploration alive

eval:
  max_plies: 200
