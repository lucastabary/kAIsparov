# scratch v2 — the whole curriculum in one command
#   kaisparov train --config config/experiments/scratch_v2/all.yaml
#
# Each stage after the first resumes from the run the previous one produced, so
# the `resume_from_run: PASTE_..._HERE` placeholders in the phase files are
# overridden with the real run ids. The phase files hold all their own settings.

title: "scratch v2 - full curriculum"
description: "8 pieces, league + dense rewards -> 16 pieces -> full games"

stages:
  - phase1.yaml
  - phase2.yaml
  - phase3.yaml
