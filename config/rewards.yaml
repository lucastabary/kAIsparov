# Reward-shaping presets. Reference one by name from a training config:
#     reward: material_aware
# ...or write the terms inline in the training config instead:
#     reward:
#       material: 0.1
#       checkmate: 8.0
#
# Terms (all from the mover's point of view, applied per ply):
#   material      * value of the captured piece (pawn 1, knight/bishop 3, rook 5,
#                 queen 9).
#   promotion     * material gained by promoting a pawn (a queen is worth +8). Without
#                 it a pawn push home scores nothing and the agent never learns to
#                 play for promotion.
#   checkmate     flat reward for delivering mate (= winning). Decoupled from material
#                 so the win reward is set here alone.
#   check         bonus if the move leaves the OPPONENT in check
#   step_penalty  subtracted every ply (encourages decisive play)
#
# Scale note: with material 0.1 a queen swing is 0.9 and a win is checkmate (8.0),
# so a win dominates any single material swing (~9x) while material stays visible.

material_only:
  material: 0.1
  promotion: 0.1
  checkmate: 8.0

aggressive:
  material: 0.1
  promotion: 0.1
  checkmate: 8.0
  check: 0.05

decisive:
  material: 0.1
  promotion: 0.1
  checkmate: 8.0
  step_penalty: 0.005

checkmate_hunter:
  material: 0.05
  promotion: 0.05
  checkmate: 10.0
  check: 0.1
  step_penalty: 0.003

# Winning dominates, material guides. In self-play the negamax credit turns the
# opponent's mate into your loss penalty, so no separate "loss" term is needed.
win_focused:
  material: 0.1
  promotion: 0.1
  checkmate: 8.0
  step_penalty: 0.005

# Recommended default: win_focused with material weighted a little more heavily, so
# the agent has a dense signal while it learns what a win even looks like.
material_aware:
  material: 0.1        # pawn .1, knight/bishop .3, rook .5, queen .9
  promotion: 0.1       # a queen promotion is +0.8
  checkmate: 8.0       # a win dominates any single material swing
  step_penalty: 0.005

# Pure outcome ("victory is the only thing that matters"). No shaping at all: the
# model must learn material value, defense and king safety on its own, from the win
# signal alone. In pool mode (rollout_vs) this yields a clean +/-1 per game: +1 on
# the mating move, -1 on the learner's move that gets mated, 0 everywhere else.
#   NOTE: material and promotion MUST be set to 0.0 explicitly — RewardSettings
#   defaults both to 1.0, so omitting them would silently leave dense rewards on.
checkmate_only:
  material: 0.0
  promotion: 0.0
  checkmate: 1.0
