# Opponent-pool presets. Reference one by name from a training config:
#     rollout:
#       opponent: pool
#       pool: sound_v4
# ...or write the same structure inline instead of a name:
#     rollout:
#       opponent: pool
#       pool:
#         opponents: [...]
#
# When `rollout.pool` is set it fully defines the pool and OVERRIDES the flat legacy
# fields (baselines / *_weight / pool_size / snapshot_every / snapshot_search_depth /
# opponent_avoid_king_suicide). Leave it unset to keep using those.
#
# Shape (flat, unified list):
#   opponents: a list of entries, each:
#     kind:   random | material | neural | minimax | snapshot
#     group:  baseline (fixed, in the pool from epoch 1) | snapshot (frozen past-selves,
#             added over training). Defaults: snapshot for kind=snapshot, else baseline.
#     weight: the entry's share of the pool (default 1.0): it faces the learner in
#             weight / sum(weights) of the games — out of N games, N * weight / sum.
#             For the snapshot entry, the share of the whole past-self stream (its
#             snapshots drawn uniformly within it), however many exist. Until the first
#             snapshot is taken, its share goes to the other opponents.
#     count:  snapshot only — max past-selves retained in the pool (default 1).
#     every:  snapshot only — add one frozen self every N epochs (default 20).
#     random_move_prob: any kind — the chance, on each move, that it plays a random legal
#             move instead of its own (default 0). A strong but fallible opponent: e.g.
#             a checkpoint's minimax at 0.1 is beatable by punishing its blunders. On
#             the snapshot entry it applies to every past-self.
#     params: that agent's own hyper-parameters:
#               random/material : seed, avoid_king_suicide
#               snapshot        : depth (0 = raw NeuralAgent, >=1 = MinimaxAgent lookahead),
#                                 avoid_king_suicide, deterministic
#               neural/minimax  : checkpoint (path to frozen weights of a past run),
#                                 depth (minimax), deterministic (neural),
#                                 avoid_king_suicide
#               minimax         : ...or evaluator: material | heuristic instead of a
#                                 checkpoint — an alpha-beta search scored on that, no
#                                 model (depth 2: ~50 ms/move on material, ~80 on the
#                                 heuristic; it keeps its pieces defended and refuses
#                                 poisoned captures, unlike `material`)
# At most one `snapshot` entry per preset.
#
# (`group_weights` is gone: fold it into the weights. The presets below were converted
# with the shares they had, e.g. v4_phase3's baseline 1.0 : snapshot 1.5 with material
# 3 : random 1 inside the baselines is material 30% / random 10% / snapshots 60%.)


# Reproduces the scratch v3 league (pure king-capture era): Material 3x Random, the
# baselines drawn 2:1 vs a depth-1 past-self stream (50% / 17% / 33%). No guard.
teachers_v3:
  opponents:
    - {kind: material, weight: 3.0}
    - {kind: random,   weight: 1.0}
    - {kind: snapshot, weight: 2.0, count: 5, every: 20, params: {depth: 1}}


# "Sound play" league: every opponent defends its own king (avoid_king_suicide), so a
# blind king rush no longer wins, and past-selves look 2 plies ahead. Use this to break
# the knight-rush strategy without any reward shaping.
sound_v4:
  opponents:  # 45% / 15% / 40%
    - {kind: material, weight: 9.0, params: {avoid_king_suicide: true}}
    - {kind: random,   weight: 3.0, params: {avoid_king_suicide: true}}
    - {kind: snapshot, weight: 8.0, count: 6, every: 15, params: {depth: 2, avoid_king_suicide: true}}


# Stage-1 starter: guard OFF so the model first learns to CAPTURE a king (against
# opponents that still leave it hanging) before we make defense matter in later stages.
endgame_starter:
  opponents:  # 50% / 17% / 33%
    - {kind: material, weight: 3.0}
    - {kind: random,   weight: 1.0}
    - {kind: snapshot, weight: 2.0, count: 5, every: 20, params: {depth: 1}}


# ---------------------------------------------------------------- scratch v4 curriculum
# Three presets, one per stage of config/experiments/scratch_v4_stage{1,2,3}.yaml.
#
# Design: EVERY opponent defends its own king (avoid_king_suicide) in all three phases,
# so no "rush the enemy king" free win is ever learnable. The guard only removes free
# one-ply king hangs, NOT reward: a genuinely trapped king (no safe move) is still
# captured, so forced captures keep scoring — the model just has to create a real threat
# instead of a one-move rush. Never unguard `random`: the model already saturates vs
# random, so unguarded random only teaches rushing a trivial opponent (no useful signal).
# Escape hatch if early reward stalls: unguard `material` (a modest-weight capture teacher
# that still punishes loose attackers), NEVER random.

# Phase 1: tiny endgames, sound from the start. Two fixed teachers, both defending; no
# snapshot stream yet.
v4_phase1-1:
  opponents:
    - {kind: material, weight: 3.0, params: {avoid_king_suicide: false}}
    - {kind: random,   weight: 1.0, params: {avoid_king_suicide: false}}

v4_phase1-2:
  opponents:
    - {kind: material, weight: 3.0, params: {avoid_king_suicide: true}}
    - {kind: random,   weight: 1.0, params: {avoid_king_suicide: true}}

# Phase 2: more material + pawns; the snapshot stream appears. All opponents defend.
v4_phase2:
  opponents:  # 45% / 15% / 40%
    - {kind: material, weight: 9.0, params: {avoid_king_suicide: true}}
    - {kind: random,   weight: 3.0, params: {avoid_king_suicide: true}}
    - {kind: snapshot, weight: 8.0, count: 6, every: 15, params: {depth: 1, avoid_king_suicide: true}}

# Phase 3: the real game. Defending self-play dominates (snapshots weighted above the
# baselines); every opponent defends.
v4_phase3:
  opponents:  # 30% / 10% / 60%
    - {kind: material, weight: 3.0, params: {avoid_king_suicide: true}}
    - {kind: random,   weight: 1.0, params: {avoid_king_suicide: true}}
    - {kind: snapshot, weight: 6.0, count: 8, every: 15, params: {depth: 1, avoid_king_suicide: true}}


# ---------------------------------------------------------------- high_entropy curriculum
# The v4 pools, plus a heuristic minimax (material + piece placement, 2 plies) at the
# material baseline's weight: `material` only grabs what hangs, this one also develops,
# keeps its own pieces defended and refuses a poisoned capture — a better opponent next
# to the cheap one. From phase 2 on, the past-selves blunder now and then
# (random_move_prob): strong, but beatable by punishing their slips. The rate is sized
# on game length, ~3-4 random moves per game: 10% of ~37 snapshot moves in phase 2
# (~75 plies), 5% of ~70 in phase 3 (~140). Cost: the heuristic search is ~40 ms/move on
# phase-1 boards, ~70 in phase 2, ~90 from the standard start (CPU).

# Bridges 0b/0c and phase 1a: no guard, as v4_phase1-1.
he_phase1:
  opponents:  # 43% / 43% / 14%
    - {kind: material, weight: 3.0}
    - {kind: minimax,  weight: 3.0, params: {evaluator: heuristic, depth: 2}}
    - {kind: random,   weight: 1.0}

# Phase 1b: everyone refuses moves that walk into mate in one, as v4_phase1-2.
he_phase1-2:
  opponents:  # 43% / 43% / 14%
    - {kind: material, weight: 3.0, params: {avoid_king_suicide: true}}
    - {kind: minimax,  weight: 3.0, params: {evaluator: heuristic, depth: 2, avoid_king_suicide: true}}
    - {kind: random,   weight: 1.0, params: {avoid_king_suicide: true}}

# Phase 2: the snapshot stream joins, blundering 10% of its moves.
he_phase2:
  opponents:  # 31% / 31% / 10% / 28%
    - {kind: material, weight: 9.0, params: {avoid_king_suicide: true}}
    - {kind: minimax,  weight: 9.0, params: {evaluator: heuristic, depth: 2, avoid_king_suicide: true}}
    - {kind: random,   weight: 3.0, params: {avoid_king_suicide: true}}
    - kind: snapshot
      weight: 8.0
      count: 6
      every: 15
      random_move_prob: 0.10
      params: {depth: 1, avoid_king_suicide: true}

# Phase 3: snapshots weighted up, blundering 5% of their (twice as many) moves.
he_phase3:
  opponents:  # 23% / 23% / 8% / 46%
    - {kind: material, weight: 3.0, params: {avoid_king_suicide: true}}
    - {kind: minimax,  weight: 3.0, params: {evaluator: heuristic, depth: 2, avoid_king_suicide: true}}
    - {kind: random,   weight: 1.0, params: {avoid_king_suicide: true}}
    - kind: snapshot
      weight: 6.0
      count: 8
      every: 15
      random_move_prob: 0.05
      params: {depth: 1, avoid_king_suicide: true}


# Example: train against a strong FIXED teacher frozen from a past run — a genuinely
# sound defender from epoch 1, not a weak early past-self. Point `checkpoint` at a
# checkpoint of the SAME architecture (model + hidden_dim). Uncomment and set the path.
