# Default training configuration for kAIsparov.
# Mirrors the code defaults in kaisparov.training.config.TrainConfig.
# Run with:  python -m kaisparov.train --config config/default.yaml

model: gnn_v1
hidden_dim: 8
epochs: 50
seed: 0
device: auto            # auto | cpu | cuda
checkpoint_every: 10
runs_dir: runs

# Document your approach — shown by `kaisparov runs`.
title: "gnn_v1 baseline"
description: "First PPO self-play run of the relational GCN backend."
notes: ""

# To continue a previous run, set its id here (architecture + any field you don't
# override are inherited). Leave null for a fresh run.
resume_from_run: null

ppo:
  learning_rate: 0.001
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  update_epochs: 4
  self_play: true

rollout:
  episodes_per_epoch: 8
  max_steps_per_episode: 100

curriculum:
  name: "Phase 1: 6 pieces"
  max_pieces_per_side: 6
  allow_major: false
  allow_minor: true
  allow_pawns: true

eval:
  enabled: true
  every: 5
  games: 20
  max_plies: 200

# Reward shaping: a preset name from config/rewards.yaml, e.g. `reward: aggressive`,
# or write the terms inline (mover's point of view, per ply):
reward:
  material: 1.0        # * value of the captured piece
  king_capture: 0.0    # extra bonus for capturing the king
  check: 0.0           # bonus if the move gives check
  step_penalty: 0.0    # subtracted every ply (rewards decisive play)
