[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaisparov"
version = "0.1.0"
description = "A Graph Neural Network that learns to play chess via PPO self-play."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Lucas Tabary" }]
keywords = ["chess", "graph-neural-network", "reinforcement-learning", "ppo", "pytorch-geometric"]

dependencies = [
    "torch>=2.0,<2.1",
    "torch-geometric>=2.5",
    "numpy>=1.24",
    "pygame>=2.1",
    "pyyaml>=6.0",
    "tensorboard>=2.12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pre-commit>=3.7",
]
notebooks = [
    "jupyter>=1.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.urls]
Repository = "https://github.com/lucastabary/kAIsparov"

[project.scripts]
kaisparov = "kaisparov.cli:main"

# ---- Package discovery (src/ layout) ----
[tool.setuptools.packages.find]
where = ["src"]
include = ["kaisparov*"]

# ---- Ruff: linter + formatter ----
[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["notebooks"]  # exploratory notebooks aren't held to the lint bar

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # function calls in argument defaults (torch idioms)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports

# ---- mypy: gradual typing (informational for now) ----
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
# game_interface (pygame UI) fights the pygame stubs; not worth typing strictly.
exclude = ["build/", "dist/", "game_interface.py"]

# ---- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
